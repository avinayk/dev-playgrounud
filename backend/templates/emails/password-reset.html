<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f0f1a;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #1a1a2e;
      border-radius: 24px;
      padding: 40px;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header {
      text-align: center;
      border-bottom: 2px solid #fbbf24;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.5px;
      color: #fbbf24;
      margin: 0;
    }
    .btn {
      display: inline-block;
      background: #fbbf24;
      color: #000;
      padding: 14px 32px;
      border-radius: 12px;
      font-weight: 900;
      text-decoration: none;
      font-size: 16px;
      margin: 20px 0;
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #3d3d5c;
      font-size: 14px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔐 Playground League</h1>
    </div>

    <h2>Hello {{name}}!</h2>

    <p style="color: #d1d5db; line-height: 1.6;">
      We received a request to reset your password. Click the button below to create a new password.
    </p>

    <div style="text-align: center;">
      <a href="{{resetLink}}" class="btn">Reset Password</a>
    </div>

    <p style="font-size: 14px; color: #9ca3af; text-align: center;">
      This link will expire in <strong style="color: #fbbf24;">1 hour</strong>.
    </p>

    <p style="font-size: 14px; color: #9ca3af; text-align: center; margin-top: 20px;">
      If you didn't request this, please ignore this email.
    </p>

    <div class="footer">
      <p>© {{year}} Playground League. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
